name: deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ROLE_ARN: arn:aws:iam::548088752838:role/final-github-actions-role
  ECR: 548088752838.dkr.ecr.us-east-1.amazonaws.com
  VISITS_INSTANCE: i-040618931ba24d097
  STATS_INSTANCE: i-0a9fc7ae16dc96341
  VISITS_IP: 10.0.11.161
  DB_HOST: final-db.c89i48y40pec.us-east-1.rds.amazonaws.com
  DB_NAME: visitsdb
  DB_USER: dbadmin
  ALLOWED_ORIGIN: http://d1smgp9uikrrna.cloudfront.net
  ALB_DNS: final-alb-1485622901.us-east-1.elb.amazonaws.com
  BUCKET: final-frontend-548088752838
  CF_ID: E3A6W741XV03IG

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      visits: ${{ steps.filter.outputs.visits }}
      stats: ${{ steps.filter.outputs.stats }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            visits:
              - 'workloads/visits-service/**'
            stats:
              - 'workloads/stats-service/**'
            frontend:
              - 'workloads/frontend/**'
      - name: Show what changed
        run: |
          echo "visits-service changed: ${{ steps.filter.outputs.visits }}"
          echo "stats-service changed:  ${{ steps.filter.outputs.stats }}"
          echo "frontend changed:       ${{ steps.filter.outputs.frontend }}"

  visits-service:
    needs: changes
    if: needs.changes.outputs.visits == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build -t $ECR/final-project-visits-service:${{ github.sha }} -t $ECR/final-project-visits-service:latest workloads/visits-service
          docker push --all-tags $ECR/final-project-visits-service
      - name: Deploy to EC2 via SSM
        run: |
          IMAGE=$ECR/final-project-visits-service:${{ github.sha }}
          cat > deploy.sh <<SCRIPT
          set -e
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR
          docker pull $IMAGE
          DB_PASSWORD=\$(aws ssm get-parameter --name /final-project/db-password --with-decryption --region $AWS_REGION --query Parameter.Value --output text)
          docker rm -f visits-service || true
          docker run -d --name visits-service --restart unless-stopped -p 8080:8080 -e DB_HOST=$DB_HOST -e DB_NAME=$DB_NAME -e DB_USER=$DB_USER -e DB_PASSWORD="\$DB_PASSWORD" -e PGSSLMODE=require -e ALLOWED_ORIGIN=$ALLOWED_ORIGIN $IMAGE
          SCRIPT
          jq -Rs '{commands: [.]}' deploy.sh > params.json
          CMD_ID=$(aws ssm send-command --instance-ids $VISITS_INSTANCE --document-name AWS-RunShellScript --parameters file://params.json --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id $CMD_ID --instance-id $VISITS_INSTANCE || true
          STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $VISITS_INSTANCE --query Status --output text)
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ]

  stats-service:
    needs: changes
    if: needs.changes.outputs.stats == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image
        run: |
          docker build -t $ECR/final-project-stats-service:${{ github.sha }} -t $ECR/final-project-stats-service:latest workloads/stats-service
          docker push --all-tags $ECR/final-project-stats-service
      - name: Deploy to EC2 via SSM
        run: |
          IMAGE=$ECR/final-project-stats-service:${{ github.sha }}
          cat > deploy.sh <<SCRIPT
          set -e
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR
          docker pull $IMAGE
          docker rm -f stats-service || true
          docker run -d --name stats-service --restart unless-stopped -p 8081:8081 -e VISITS_SERVICE_URL=http://$VISITS_IP:8080 -e ALLOWED_ORIGIN=$ALLOWED_ORIGIN $IMAGE
          SCRIPT
          jq -Rs '{commands: [.]}' deploy.sh > params.json
          CMD_ID=$(aws ssm send-command --instance-ids $STATS_INSTANCE --document-name AWS-RunShellScript --parameters file://params.json --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id $CMD_ID --instance-id $STATS_INSTANCE || true
          STATUS=$(aws ssm get-command-invocation --command-id $CMD_ID --instance-id $STATS_INSTANCE --query Status --output text)
          echo "SSM status: $STATUS"
          [ "$STATUS" = "Success" ]

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Inject ALB address
        run: sed -i "s|__API_BASE_URL__|http://$ALB_DNS|" workloads/frontend/index.html
      - name: Upload to S3
        run: aws s3 sync workloads/frontend/ s3://$BUCKET/
      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id $CF_ID --paths "/*"
